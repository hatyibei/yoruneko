# GitHub Actions Schedule Trigger Template
#
# Two patterns included:
# - Pattern A: In-repo (agent works on the same repository)
# - Pattern B: Cross-repo trigger (agent orchestrates via API)
#
# Choose one pattern and delete the other.

# ============================================================
# Pattern A: In-Repo Schedule
# Use when the agent reads/modifies code in THIS repository.
# Example: code review, dependency updates, report generation.
# ============================================================

name: "Scheduled Agent - Pattern A (In-Repo)"

on:
  schedule:
    # Run daily at 09:00 UTC (18:00 JST)
    # Cron reference: minute hour day-of-month month day-of-week
    - cron: "0 9 * * *"
  workflow_dispatch: # Allow manual trigger for testing

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Prevent runaway execution

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run scheduled task
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Add any additional secrets your CLAUDE.md references:
          # SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # APP_API_TOKEN: ${{ secrets.APP_API_TOKEN }}
        run: |
          claude --print "Execute the scheduled task as defined in CLAUDE.md" \
            --allowedTools "Read,Write,Edit,Bash,Glob,Grep" \
            --max-turns 20

      - name: Upload results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-results-${{ github.run_number }}
          path: |
            reports/
            logs/
          retention-days: 30


