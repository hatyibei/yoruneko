# ============================================================
# Common cron schedule examples (all times UTC):
# ============================================================
#
# Every hour:           "0 * * * *"
# Every 6 hours:        "0 */6 * * *"
# Daily at midnight:    "0 0 * * *"
# Daily at 9 AM:        "0 9 * * *"
# Weekdays at 9 AM:     "0 9 * * 1-5"
# Monday at 9 AM:       "0 9 * * 1"
# First of month:       "0 0 1 * *"
# Every 15 minutes:     "*/15 * * * *"  (minimum: 5 minutes)
#
# Note: GitHub Actions may delay scheduled runs by minutes
# to hours on busy periods. Do not rely on exact timing.
# Inactive repos (no commits in 60 days) may have schedules
# disabled automatically.
# ============================================================


# ============================================================
# Required repository secrets (Settings > Secrets > Actions):
# ============================================================
#
# ANTHROPIC_API_KEY   - Claude API key (required)
#                       Pro plan users: API usage included
#                       Free: need separate API billing
#
# Add any secrets referenced in your CLAUDE.md:
# SLACK_WEBHOOK_URL   - Slack incoming webhook
# APP_API_URL         - Your application's API base URL
# APP_API_TOKEN       - API authentication token
# ============================================================
